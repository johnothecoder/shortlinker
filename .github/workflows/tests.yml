name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shrtlnk
          POSTGRES_USER: shrtlnk
          POSTGRES_PASSWORD: shrtlnk
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shrtlnk -d shrtlnk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          SECRET_KEY: github-actions-test-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: shrtlnk
          DB_USER: shrtlnk
          DB_PASSWORD: shrtlnk
          DB_HOST: localhost
          DB_PORT: "5432"
          TIMEZONE: Europe/London
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          SECRET_KEY: github-actions-test-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_NAME: shrtlnk
          DB_USER: shrtlnk
          DB_PASSWORD: shrtlnk
          DB_HOST: localhost
          DB_PORT: "5432"
          TIMEZONE: Europe/London
        run: python manage.py test