{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}shrtlnkr{% endblock %}
    </title>

    <meta
        name="description"
        content="{% block meta_description %}A simple self-hosted short-link service.{% endblock %}"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    />

    <link
        rel="stylesheet"
        href="{% static 'shrtlnk/css/app.css' %}"
    />

    {% block extra_head %}{% endblock %}
</head>

<body>
<div class="container">
    <header class="site-header text-center">
        <h1>
            <a href="{% url 'home' %}" class="site-logo">
            <img src="{%  static 'shrtlnk/images/shrtlnkr.png' %}" alt="shrtlnkr">
        </a>
        </h1>
    </header>
    <main class="site-main pb-4 mb-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer text-center pt-4 mt-4 border-top">
        <p>
            <a href="https://jtclabs.com/projects/shrtlnkr">shrtlnkr</a> |
            <a href="https://johnothecoder.uk">JohnoTheCoder</a> |
            <a href="https://jtclabs.com">JTC Labs</a> |
            <a href="https://github.com/johnothecoder/shortlinker">GitHub</a>
        </p>
    </footer>
</div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

    {% block scripts %}{% endblock %}
</body>
</html>
